[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-source-attribution"
version = "1.0.0"
description = "Reproducible RGB-NPR image source attribution with a processing curriculum"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Soumick Sarker"}]
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "numpy==2.2.6",
  "Pillow==12.3.0", "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["ruff==0.17.1"]
figures = ["matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
